# Example only. In production prefer Vault Secrets Operator (VSO), External
# Secrets Operator, or Vault Agent Injector so the Deployment's envFrom
# references a secret that's synced from Vault rather than committed here.
apiVersion: v1
kind: Secret
metadata:
  name: configurable-agent-provider-keys
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "replace-me"
  # OPENAI_API_KEY: "replace-me"
  # GOOGLE_GENERATIVE_AI_API_KEY: "replace-me"
  TAVILY_API_KEY: "replace-me"
