apiVersion: apps/v1
kind: Deployment
metadata:
  name: configurable-agent
  labels:
    app.kubernetes.io/name: configurable-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: configurable-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configurable-agent
    spec:
      # Route host.docker.internal to the kind network's host-gateway so the
      # pod can reach services on the developer's laptop (e.g. a local ollama).
      hostAliases:
        - ip: "172.23.0.1"
          hostnames: ["host.docker.internal"]
      containers:
        - name: configurable-agent
          image: eggai-configurable-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CONFIG_PATH
              value: /etc/configurable-agent/config.yaml
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: info
          envFrom:
            # Populated by Vault Secrets Operator, External Secrets, or a plain Secret.
            # Expected keys: ANTHROPIC_API_KEY / OPENAI_API_KEY / GOOGLE_GENERATIVE_AI_API_KEY
            # plus TAVILY_API_KEY if websearch is enabled.
            - secretRef:
                name: configurable-agent-provider-keys
          volumeMounts:
            - name: config
              mountPath: /etc/configurable-agent
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: configurable-agent-config
            items:
              - key: config.yaml
                path: config.yaml
