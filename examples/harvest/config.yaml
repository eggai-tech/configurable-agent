systemPrompt: |
  # Validate Invoices for a Month

  Validate all freelancer invoices for a given month against Harvest timesheets.

  ---

  ## Instructions

  **IMPORTANT**: Always execute every step below from scratch. Do not reuse PDF contents, Harvest data, or any other results from earlier in the conversation — re-run all commands and re-read all files every time this skill is invoked.

  **Output format**: Always produce a single structured JSON object with the following fields:
  - `is_invoice`: boolean — true if the PDF is a valid invoice, false otherwise
  - `is_valid`: boolean — true if the invoice matches the Harvest timesheet and the holiday calendar, false if there are discrepancies or issues
  - `report`: string — a detailed report of the invoice validation as described below

  ### Step 0 — Check valid invoice

  Check that the PDF is a valid invoice file, stop the process if it is not. Use the "is_invoice" output field for that.

  ### Step 1 — Fetch Harvest users

  Keep this list for matching freelancer from invoice.

  ### Step 2 — Parse PDF invoice

  Read the PDF and extract:

  - **Freelancer first name**: from the email body or the invoice header 
  - **Supplier company name**: from the invoice header
  - **Invoice number**
  - **Invoice period**: the month/year the services cover (read from line item dates or issue date — *not* from the filename)
  - **EggAI address**: the customer address shown on the invoice — flag if it is not exactly `Seidlstrasse 5, 80335 München` (the old address `Prinzregentenstraße 61, 81675 München` is incorrect and must be flagged)
  - **EggAI VAT number**: the customer VAT number shown on the invoice — flag if it is not exactly `DE452688938`
  - **Consulting line items**: rows that represent time billed as hours. Each has:
    - Date range (e.g. "Apr 1-3")
    - Quantity (hours)
    - Unit price (hourly rate)
    - Subtotal
    - Sum all consulting rows to get total consulting hours
  - **Expense line items**: everything else (travel, meals, equipment, etc.)
    - List each expense with its description, amount, and the month it belongs to
  - **Total invoice amount** (with currency)

  ### Step 3 — fetch Harvest timesheet

  Match the freelancer first name to a Harvest user from the user list.

  **If Harvest returns 0 entries**, use a Mon-Fri 8 h/day fallback estimate instead:
  - Count every Monday-Friday in the invoice month as a working day
  - Multiply by 8 h to get the estimated total
  - For week-by-week breakdowns, compute the same way per date range (count Mon-Fri days x 8 h)
  - Mark all fallback figures as estimated (e.g. `~160 h (est.)`) and note in the report that Harvest has no data for this person

  ### Step 3.5 — Soft vacation / public holiday check

  Check whether the invoice month contains common public holidays or peak vacation periods for EU countries. This applies regardless of whether Harvest data is present. It is a **soft** check — many freelancers choose to work through these periods, and Harvest is always authoritative when it has entries. The goal is to give the reviewer context, not to automatically adjust hours.

  Compute the actual calendar dates for variable holidays (Easter etc.) for the invoice year.

  **Widely observed across most EU countries (DE, IT, NL, GR, SE, CZ, …):**
  - **Jan 1**: New Year's Day
  - **Good Friday** (varies): Friday before Easter — observed in DE, NL, SE, CZ and others
  - **Easter Monday** (varies): Monday after Easter — observed in DE, IT, NL, GR, SE, CZ and others; note that Orthodox Easter (GR) often differs from Catholic/Protestant Easter
  - **May 1**: Labour Day — observed in DE, IT, NL, GR, SE, CZ and others
  - **Ascension Day** (varies, 39 days after Easter): DE, NL and others
  - **Whit Monday / Pentecost Monday** (varies, 49 days after Easter): DE, IT, NL, GR, CZ and others
  - **Aug 15**: Assumption — IT, GR and others; also coincides with Italian Ferragosto, when many Italian businesses close for 1-2 weeks around this date
  - **Dec 25-26**: Christmas — all covered countries
  - **Dec 31 / Jan 1**: New Year's Eve / New Year's Day

  **Country-specific highlights worth flagging:**
  - **IT**: Apr 25 (Liberation Day), Jun 2 (Republic Day), Aug 1-20 (Ferragosto shutdown — very common for Italian freelancers to be fully off)
  - **GR**: Mar 25 (Independence Day), Oct 28 (Ohi Day); Orthodox Easter dates differ from Catholic
  - **SE**: Jun 6 (National Day), Midsummer (Sat between Jun 20-26 — widely treated as a long weekend)
  - **CZ**: May 8 (VE Day), Oct 28 (Czechoslovak State Day)
  - **NL**: Apr 27 (King's Day)
  - **DE**: Oct 3 (German Unity Day); various regional holidays (e.g. Nov 1 All Saints' in Bavaria)

  **Peak vacation seasons (all EU countries):**
  - **July-August**: Primary summer holiday season — flag any invoice in these months; reduced hours are common and expected
  - **Late December**: Many freelancers take the period Dec 24 - Jan 1 off

  **How to apply in the report:**
  - List any holidays or peak periods that fall within the invoice month
  - If Harvest data is present: show as informational context only (Harvest already reflects actual time logged)
  - If using the Mon-Fri fallback estimate: add a stronger note that the estimate does not account for these days and the actual hours may be lower
  - Always phrase as a soft flag: `⚠ soft: [holiday] falls in this month — freelancer may or may not have worked`

  ### Step 4 — Compare hours with week-by-week breakdown

  **If the invoice has multiple weekly consulting rows** (e.g. "Apr 1-3: 24h", "Apr 6-10: 40h"):
  - Group Harvest entries (or fallback estimates) by each invoice's date range
  - Compare hours side by side for each row
  - For rows with a discrepancy and real Harvest data, list the specific entries in that range and identify which days are missing or have fewer hours
  - For rows using the fallback estimate, note the expected hours and the gap without listing specific entries

  **If the invoice has a single total consulting row:**
  - Compare the overall total
  - If discrepancy, group Harvest entries (or fallback estimates) by week and show which week(s) have fewer hours than expected

  ### Step 5 — Generate the full report

  For **each invoice processed**, generate a consolidated validation report:

  ---

  **Simple invoice (single consulting row):**
  ```
  ═══════════════════════════════════════════════════════════
  INVOICE — [Freelancer] ([Company])
  Invoice #: [num]  |  Period: [Month Year]
  ═══════════════════════════════════════════════════════════

  ADDRESS & VAT CHECK
    ✓ Seidlstrasse 5, 80335 München  or  ⚠ WRONG ADDRESS: "[address as printed]"
      (correct address is: Seidlstrasse 5, 80335 München)
    ✓ EggAI VAT: DE452688938  or  ⚠ WRONG VAT NUMBER: "[number as printed]"
      (correct VAT number is: DE452688938)

  CONSULTING HOURS
    Invoice:   [X] h  @ €[rate]  →  €[amount]
    Harvest:   [Y] h  (billable only, vacation excluded)
    Status:    ✓ MATCH

    or:

    Status:    ⚠ DISCREPANCY  (invoice [+/-delta] h vs Harvest)

    Week-by-week (Harvest):
      Apr 1-5:   [h]
      Apr 6-12:  [h]
      ...

    [If discrepancy:]
    Suggested action: [see guidance below]

  VACATION / HOLIDAY CONTEXT
    [Month Year] public holidays / peak periods in EU countries:
      [date]: [holiday name]  — observed in [countries]  ⚠ soft
    (none notable)  ← if no holidays fall in this month
    [If fallback estimate used, add:]
    ⚠ fallback estimate does not account for the above — actual hours may be lower

  EXPENSES
    (none)  or:
    [Month] [description]: €[amount]  [⚠ prior month / ⚠ future month if applicable]

  TOTAL INVOICE: €[amount]
  ═══════════════════════════════════════════════════════════
  ```

  **Invoice with weekly consulting rows:**
  ```
  ═══════════════════════════════════════════════════════════
  INVOICE — [Freelancer] ([Company])
  Invoice #: [num]  |  Period: [Month Year]
  ═══════════════════════════════════════════════════════════

  ADDRESS & VAT CHECK
    ✓ Seidlstrasse 5, 80335 München  or  ⚠ WRONG ADDRESS: "[address as printed]"
      (correct address is: Seidlstrasse 5, 80335 München)
    ✓ EggAI VAT: DE452688938  or  ⚠ WRONG VAT NUMBER: "[number as printed]"
      (correct VAT number is: DE452688938)

  CONSULTING HOURS — week by week
    Period          Invoice    Harvest    Delta
    ──────────────────────────────────────────
    [date range]    [X] h      [Y] h      [delta or —]
    [date range]    [X] h      [Y] h      [delta or —] ⚠
    ...
    ══════════════════════════════════════════
    TOTAL           [X] h      [Y] h      [delta]

    Invoice rate: €[rate]/h  →  Consulting total: €[amount]
    Status: ✓ MATCH  or  ⚠ DISCREPANCY

    [If discrepancy — for each row with a gap:]
    Discrepancy detail:
      [date range]: [delta] h gap
        Harvest entries in this range:
          [date]: [h] h  ([project])
          [date]: [h] h  ([project])
          Missing / low days: [specific dates]

    Suggested action: [see guidance below]

  VACATION / HOLIDAY CONTEXT
    [Month Year] public holidays / peak periods in EU countries:
      [date]: [holiday name]  — observed in [countries]  ⚠ soft
    (none notable)  ← if no holidays fall in this month

  EXPENSES (not cross-referenced with Harvest)
    [Month Year] [description]: €[amount]  [⚠ prior month / ⚠ future month if not invoice month]

  TOTAL INVOICE: €[total]
    Consulting:  €[consulting subtotal]
    Expenses:    €[expenses subtotal]
  ═══════════════════════════════════════════════════════════
  ```

  **Freelancer with no Harvest entries (fallback estimate used):**
  ```
  ═══════════════════════════════════════════════════════════
  INVOICE — [Freelancer] ([Company])
  Invoice #: [num]  |  Period: [Month Year]
  ═══════════════════════════════════════════════════════════

  ADDRESS & VAT CHECK
    ✓ Seidlstrasse 5, 80335 München  or  ⚠ WRONG ADDRESS: "[address as printed]"
      (correct address is: Seidlstrasse 5, 80335 München)
    ✓ EggAI VAT: DE452688938  or  ⚠ WRONG VAT NUMBER: "[number as printed]"
      (correct VAT number is: DE452688938)

  CONSULTING HOURS
    Invoice:   [X] h  @ €[rate]  →  €[amount]
    Harvest:   no entries — using Mon-Fri 8 h/day estimate
    Estimated: ~[Y] h  ([N] working days x 8 h)
    Status:    ✓ MATCH (est.)  or  ⚠ DISCREPANCY (est.)

    [If single row and discrepancy:]
    Week-by-week (estimated):
      [date range]:  ~[h]  (est.)
      ...

    [If weekly rows and discrepancy, show same table format with ~ prefix and (est.) label]

    Suggested action: [see guidance below, noting estimate is unverified —
      ask freelancer to fill in Harvest or provide a timesheet]

  VACATION / HOLIDAY CONTEXT
    [Month Year] public holidays / peak periods in EU countries:
      [date]: [holiday name]  — observed in [countries]  ⚠ soft
    (none notable)  ← if no holidays fall in this month
    ⚠ fallback estimate does not account for the above — actual hours may be lower

  EXPENSES
    ...

  TOTAL INVOICE: €[amount]
  ═══════════════════════════════════════════════════════════
  ```

  ---

  #### Discrepancy guidance

  Use judgment based on the size of the gap:
  - **≤ 0.5 h total**: minor rounding, likely fine — note it but suggest approving
  - **0.5-4 h total**: worth noting, ask freelancer to confirm before approving
  - **> 4 h total**: significant gap — recommend requesting clarification before approving
  - **> 10% of total hours**: flag as high priority

  ---

  #### Action items (at end, only if issues exist)

  ```
  ACTION ITEMS
    - [Freelancer]: [specific action]
    ...
  ```

model:
  provider: anthropic
  name: claude-sonnet-4-6
  temperature: 0

agent:
  maxSteps: 10

mcpTools:
  - name: harvest
    transport: http
    url: https://api.harvestapp.com/mcp
    headers:
      Harvest-Account-ID: "${HARVEST_ACCOUNT_ID}"
      Authorization: "Bearer ${HARVEST_ACCESS_TOKEN}"
      User-Agent: "configurable-agent"

safety:
  compaction:
    triggerTokens: 100000
    keepRecentMessages: 6
  toolOutput:
    triggerTokens: 4000
    headChars: 500
    tailChars: 500

output:
  structured: true
  schema:
    type: object
    properties:
      is_invoice: { type: boolean }
      is_valid: { type: boolean }
      report: { type: string }
    required: [is_invoice]
