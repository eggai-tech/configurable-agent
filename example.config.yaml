systemPrompt: |
  You are Configurable Agent, a helpful assistant. Use the tools available to you to answer
  the user's question. When you are ready to answer, produce a concise response.

  Today is {{today}} (current time: {{now}}). You are running in {{cwd}}.

# Handlebars variables available in systemPrompt:
#   {{now}}    — ISO datetime at invocation
#   {{today}}  — YYYY-MM-DD at invocation
#   {{cwd}}    — process working directory
# Plus any keys you define under promptVars below.
# promptVars:
#   teamName: Platform

model:
  provider: anthropic
  name: claude-sonnet-4-6
  temperature: 0.2

agent:
  maxSteps: 10

# Tools are external MCP servers — none are bundled in this image.
# Add your own executables to a derived Docker image and reference them here.
#
# Deployment pattern:
#   FROM eggai/eggai-configurable-agent:latest
#   COPY --from=my-mcp-builder /app/my-tool /usr/local/bin/my-tool
#   COPY config.yaml /etc/configurable-agent/config.yaml
#
# Each entry in mcpTools is an MCP server. Two transports are supported:
#
#   transport: stdio   — configurable-agent spawns the server as a child process per invocation
#   transport: http    — configurable-agent connects to a remote MCP server over HTTP

mcpTools: []

# Example stdio server (local executable on PATH):
# mcpTools:
#   - name: accounts
#     transport: stdio
#     command: accounts-mcp
#     args: []
#     env:
#       ACCOUNTS_URL: http://accounts:8080
#
# Example HTTP server (remote MCP service):
# mcpTools:
#   - name: files
#     transport: http
#     url: https://files.internal/mcp
#     headers:
#       X-Tenant: acme

safety:
  compaction:
    # When the full message history exceeds this many (tiktoken-estimated) tokens,
    # older turns are LLM-summarized before the next model call.
    triggerTokens: 100000
    # Number of most-recent messages to keep verbatim after compaction.
    keepRecentMessages: 6
  toolOutput:
    # Tool results larger than this are replaced with an LLM summary plus
    # head/tail excerpts before being added to conversation history.
    triggerTokens: 4000
    headChars: 500
    tailChars: 500

output:
  structured: false
  # Example structured output:
  # structured: true
  # schema:
  #   type: object
  #   properties:
  #     answer: { type: string }
  #     confidence: { type: number, minimum: 0, maximum: 1 }
  #     citations:
  #       type: array
  #       items: { type: string, format: uri }
  #   required: [answer, confidence]
