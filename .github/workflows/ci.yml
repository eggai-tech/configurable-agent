name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eggai-tech/configurable-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:lint
      - run: pnpm run typecheck
      - run: pnpm run test

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if changelog is required
        id: needs-changelog
        run: |
          git fetch origin main
          CHANGED=$(git diff origin/main --name-only)
          CODE_CHANGED=$(echo "$CHANGED" | grep -E "^(src/|tests/|package\.json)" | grep -v "^CHANGELOG.md" || true)
          if [ -z "$CODE_CHANGED" ]; then
            echo "required=false" >> $GITHUB_OUTPUT
          else
            echo "required=true" >> $GITHUB_OUTPUT
          fi

      - name: Check changelog updated
        if: steps.needs-changelog.outputs.required == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if echo "$HEAD_REF" | grep -qE '^release/v'; then
            VERSION=$(echo "$HEAD_REF" | sed 's/release\/v//')
            if echo "$VERSION" | grep -qE '\-(rc|alpha|beta)\.[0-9]+$'; then
              UNRELEASED=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | tail -n +2 | head -n -1)
              if ! echo "$UNRELEASED" | grep -qE "^### " || ! echo "$UNRELEASED" | grep -qE "^- "; then
                echo "::error::Prerelease release PR must have entries under [Unreleased] in CHANGELOG.md"
                exit 1
              fi
              exit 0
            fi
            if grep -qE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
              exit 0
            else
              echo "::error::Release PR must have a version entry in CHANGELOG.md"
              exit 1
            fi
          fi
          CHANGELOG_DIFF=$(git diff origin/main...HEAD -- CHANGELOG.md)
          if [ -z "$CHANGELOG_DIFF" ]; then
            echo "::error::CHANGELOG.md must be updated. Add your changes under [Unreleased]."
            exit 1
          fi
          UNRELEASED=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | tail -n +2 | head -n -1)
          if ! echo "$UNRELEASED" | grep -qE "^### "; then
            echo "::error::Add a category header (### Added, ### Fixed, etc.) under [Unreleased] in CHANGELOG.md"
            exit 1
          fi
          if ! echo "$UNRELEASED" | grep -qE "^- "; then
            echo "::error::Add at least one entry under [Unreleased] in CHANGELOG.md"
            exit 1
          fi
          echo "Changelog check passed!"

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
