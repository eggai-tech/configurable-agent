# Open Code Review - automated PR review
#
# Based on the upstream recipe at
# https://github.com/alibaba/open-code-review/blob/main/examples/github_actions/ocr-review.yml
#
# Reviews every PR against main automatically and supports on-demand
# re-review via a PR comment starting with '/open-code-review' or
# '@open-code-review' (MEMBER / OWNER / COLLABORATOR authors only).
#
# LLM credentials reuse the ANTHROPIC_API_KEY repository secret that the
# previous QualOps workflow used. The model can be overridden with an
# OCR_LLM_MODEL repository variable (Settings -> Secrets and variables ->
# Actions -> Variables); see action.yml upstream for the full input list.

name: Open Code Review

# Conditional concurrency group: matching events (PR events + review
# comments) share a per-PR group so a new review cancels a stale one, while
# unrelated comments land in a unique noop group and never cancel anything.
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target (rather than pull_request) so secrets are available
  # for PRs from forks. The action only reads the diff; it never executes
  # code from the PR.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            // issue_comment events carry no pull_request payload, so resolve
            // the PR's base/head here for the action to review the right diff.
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run Open Code Review
        uses: alibaba/open-code-review@v1.13.2
        with:
          llm_url: https://api.anthropic.com/v1/messages
          llm_auth_token: ${{ secrets.ANTHROPIC_API_KEY }}
          llm_model: ${{ vars.OCR_LLM_MODEL || 'claude-opus-5-5' }}
          llm_use_anthropic: 'true'
          # For issue_comment triggers pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
