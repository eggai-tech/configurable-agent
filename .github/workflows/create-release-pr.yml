name: Prepare Release Branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0 or 0.2.0-rc.1)'
        required: true
        type: string

jobs:
  prepare-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Validate version format
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|alpha|beta)\.[0-9]+)?$'; then
            echo "::error::Invalid version format '$VERSION'. Allowed: X.Y.Z, X.Y.Z-rc.N, X.Y.Z-alpha.N, X.Y.Z-beta.N"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if echo "$VERSION" | grep -qE '\-(rc|alpha|beta)\.[0-9]+$'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Validate changelog has unreleased changes
        if: env.IS_PRERELEASE == 'false'
        run: |
          UNRELEASED=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | tail -n +2 | head -n -1)
          if [ -z "$(echo "$UNRELEASED" | grep -E '^### ')" ]; then
            echo "::error::No changes found in [Unreleased] section of CHANGELOG.md"
            exit 1
          fi
          echo "Found changelog entries in [Unreleased] section"

      - name: Create release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b release/v$VERSION

      - name: Update package.json version
        run: |
          pnpm version $VERSION --no-git-tag-version
          pnpm biome format --write package.json
          echo "Updated package.json to version $VERSION"

      - name: Update changelog for stable release
        if: env.IS_PRERELEASE == 'false'
        run: |
          DATE=$(date +%Y-%m-%d)
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] - $DATE/" CHANGELOG.md
          echo "Updated CHANGELOG.md with version $VERSION"

      - name: Commit and push
        run: |
          git add package.json pnpm-lock.yaml CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git push origin release/v$VERSION
          echo "BRANCH_PUSHED_THIS_RUN=true" >> $GITHUB_ENV

      # GitHub Actions is not allowed to open pull requests in this repo (org-level
      # setting), so the workflow stops here and the operator opens the PR by hand.
      # Merging a PR from a release/v* branch triggers npm-publish.yml.
      - name: Next steps
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          COMPARE_URL="$SERVER_URL/$REPO/compare/main...release/v$VERSION?expand=1&title=chore%3A%20release%20v$VERSION&labels=release"
          {
            echo "## Release branch \`release/v$VERSION\` pushed"
            echo
            echo "Open the release PR, then merge it. Merging tags \`v$VERSION\` and publishes to npm."
            echo
            echo "- [Open PR in the browser]($COMPARE_URL)"
            echo "- Or from a terminal:"
            echo
            echo '```bash'
            echo "gh pr create --repo $REPO --base main --head release/v$VERSION \\"
            echo "  --title \"chore: release v$VERSION\" --label release \\"
            echo "  --body \"After merging, the release will be automatically tagged and published to npm.\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Release branch pushed. Open the PR: $COMPARE_URL"

      - name: Cleanup release branch on failure
        if: failure() && env.BRANCH_PUSHED_THIS_RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin --delete "release/v$VERSION" || echo "::warning::Failed to delete branch; remove manually."
